name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # 干净环境安装依赖并跑测试：拦住"代码能跑但依赖没声明"的问题（如 cnlunar 缺失）
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest -q --tb=line -rf | tee /tmp/pytest.log
      # 失败时把 pytest 摘要打成 ::error:: 注解（checks API 无需凭证即可读，便于离线排查）
      - name: Dump failure summary
        if: failure()
        run: |
          if [ -f /tmp/pytest.log ]; then
            grep -E '^(FAILED|ERROR) |^E   ' /tmp/pytest.log | head -25 | while IFS= read -r l; do echo "::error::"; done
          else
            echo "::error::pytest log missing (failure before Run tests step)"
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          pip install ruff
          ruff check .
