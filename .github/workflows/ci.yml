name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # 干净环境安装依赖并跑测试：拦住"代码能跑但依赖没声明"的问题（如 cnlunar 缺失）
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest -q --tb=line -rf | tee /tmp/pytest.log
      # 失败时把 pytest 摘要打成 ::error:: 注解（checks API 无需凭证即可读，便于离线排查）
      - name: Dump failure summary
        if: failure()
        run: |
          if [ -f /tmp/pytest.log ]; then
            grep -E '^(FAILED|ERROR) |^E   ' /tmp/pytest.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done
          else
            echo "::error::pytest log missing (failure before Run tests step)"
          fi
      # 失败时把 pytest 输出尾部开成 issue（匿名可读，用于无凭证排查）
      - name: Open failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { tail -c 4000 /tmp/pytest.log 2>/dev/null || echo "pytest.log missing"; } > /tmp/fail.txt
          echo "python: ${{ matrix.python-version }}" >> /tmp/fail.txt
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "CI failure at ${GITHUB_SHA::7} (py ${{ matrix.python-version }})" \
            --body-file /tmp/fail.txt || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          pip install ruff
          ruff check .
