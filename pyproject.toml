[project]
name = "qq-bot"
version = "0.1.0"
description = "QQ Bot based on NoneBot2"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = [
    "E501",  # 行长由 line-length 软约束，历史代码不强制折行
    "B008",  # NoneBot 依赖注入惯用函数调用作默认参数
]

[tool.nonebot]
plugin_dirs = ["plugins"]
plugins = ["nonebot_plugin_parser"]
